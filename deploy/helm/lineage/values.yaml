# Default values for the Lineage chart. `dev` (SQLite + PVC, zero external deps) is the
# baseline; layer values-prod.yaml for HA + Postgres. See docs/08-deployment-helm.md.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/proseria-research/lineage
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# SQLite is single-writer, so replicaCount MUST be 1 with engine=sqlite (the chart enforces
# this). Postgres allows >1.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  # IRSA / workload-identity annotations for storage credentials (§05.4). Example:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123:role/lineage
  annotations: {}

database:
  engine: sqlite # sqlite | postgres
  sqlite:
    pvc:
      size: 5Gi
      storageClass: ""
    path: /data/lineage.db
  postgres:
    # A Secret holding the full DSN (keeps the password out of the ConfigMap, §08.6).
    dsnSecret:
      name: ""
      key: dsn

cache:
  engine: memory # memory | redis
  redis:
    addr: "" # host:port of an external/managed Redis
    db: 0
    passwordSecret: { name: "", key: password }

storage:
  driver: fs # fs | s3 | oci
  fs:
    root: /data/artifacts
  oci:
    registry: "" # host[:port] only, no path — ghcr.io, harbor.internal, registry:5000
    repository: "" # prefix Lineage owns; a model's repo is <repository>/<model>
    plainHttp: false # in-cluster/dev registries only
    # A robot account or registry token. Omit for an anonymous (public) pull (§05.4.2).
    credentialsSecret:
      name: ""
      usernameKey: username
      passwordKey: password
  s3:
    bucket: ""
    region: ""
    endpoint: "" # override for MinIO / R2 / Ceph
    pathStyle: false
    # Static keys via a Secret; omit to use the IRSA/ECS/IMDS chain (§05.4.1).
    credentialsSecret:
      name: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey
  gc:
    mode: retain # retain | sweep
    grace: 24h
    interval: 1h
    prefix: ""

actorHeader: X-Lineage-Actor

# Evidence survival (§19). Both mechanisms are refusals or attestations — nothing here
# deletes anything on a timer.
compliance:
  retention:
    # Art. 18's ten years. DELETE refuses on anything younger, measured against the youngest
    # record the delete would destroy. 0 disables the floor and is a real choice, not "unset".
    minArchivedVersionDays: 3650
    # Reported, not enforced: nothing in core deletes an audit event. It is the number a
    # filing cites.
    minAuditAgeDays: 3650
  auditAttestation:
    # Merkle epoch sealing over the audit log (§19.5). On by default — it costs one derived
    # integer on the write path.
    enabled: true
    # Also the bound on the unsealed window: rows in the currently-open epoch are not yet
    # protected. Changing this on a registry that has already sealed is refused (§19.5.5).
    sealIntervalSeconds: 60
    # Delay past an epoch's end before sealing, so a transaction begun inside it commits
    # first. Must be shorter than the interval.
    sealGraceSeconds: 5

service:
  type: ClusterIP
  modelApiPort: 8081
  adminUiPort: 8080
  opsPort: 9090

ingress:
  modelApi:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: [] # [{ secretName: model-api-tls, hosts: [api.example.com] }]
  adminUi:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Restrict :8080 (Admin UI) ingress to trusted sources; :8081 (Model API) is open to
# in-cluster serving systems (§08.6). Auth itself is infra's job (§00 axiom 4).
networkPolicy:
  enabled: false
  adminUiFrom: [] # []networkpolicy.io peers allowed to reach :8080

observability:
  metrics: true
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
  # OTLP/HTTP collector for traces (§09.4). Empty = tracing off: correlation IDs still work,
  # spans need a collector. Accepts host:port (plaintext) or an http(s):// URL.
  otlpEndpoint: ""
  serviceName: "" # resource service.name; defaults to the release fullname
  traceSampleRatio: 1.0 # parent-based head sampling; lower it on hot installs
  # SLO alert rules over the RED metrics (§09.5). Needs the Prometheus operator, like
  # serviceMonitor. Thresholds are the starting targets — tune per install.
  prometheusRule:
    enabled: false
    labels: {} # e.g. release: kube-prometheus-stack, so the operator picks the rule up
    slo:
      resolveAvailability: 99.9 # percent of resolves that must not 5xx
      resolveLatencyP99Seconds: 0.05 # cache-hit p99 target
      publishSuccessRate: 99.5 # percent of publishes that must succeed
    # Window each error-budget rule burns over before it fires.
    window: 30m
    for: 10m

migrations:
  auto: true # run the migrate Job (pre-install/pre-upgrade) for postgres

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: "1", memory: 512Mi }

# Hardened by default (§08.6): non-root, read-only rootfs, no privilege escalation, dropped caps.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []

# Optional subcharts (see Chart.yaml). Disabled by default — external managed DB/cache is the
# recommended path. Enable then `helm dependency build`.
postgresql:
  enabled: false
redis:
  enabled: false
