{{- $full := include "lineage.fullname" . -}}
{{- if .Values.ingress.modelApi.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-model-api
  labels: {{- include "lineage.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-api
  {{- with .Values.ingress.modelApi.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.modelApi.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.modelApi.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.modelApi.host }}
      host: {{ .Values.ingress.modelApi.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-model-api
                port: { name: model-api }
{{- end }}
{{- if .Values.ingress.adminUi.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-admin-ui
  labels: {{- include "lineage.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
  {{- with .Values.ingress.adminUi.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.adminUi.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.adminUi.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.adminUi.host }}
      host: {{ .Values.ingress.adminUi.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-admin-ui
                port: { name: admin-ui }
{{- end }}
