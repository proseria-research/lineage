# dev profile: zero external dependencies — SQLite on a PVC, in-memory cache, fs storage,
# single replica, Model API ingress only. `helm install lineage ./deploy/helm/lineage -f values-dev.yaml`.

replicaCount: 1

database:
  engine: sqlite

cache:
  engine: memory

storage:
  driver: fs

ingress:
  modelApi:
    enabled: true
  adminUi:
    enabled: false

autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false

# No retention floor on a dev install: a registry that refuses to delete anything you made
# this decade is not usable for development. Sealing stays on — it costs nothing and it is
# the behaviour you want to have exercised before production.
compliance:
  retention:
    minArchivedVersionDays: 0
    minAuditAgeDays: 0
