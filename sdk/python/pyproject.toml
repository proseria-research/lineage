[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineage-sdk"
version = "0.1.0"
description = "Python client for the Lineage Model API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Proseria Research" }]

[project.urls]
Homepage = "https://github.com/proseria-research/lineage"

[tool.hatch.build.targets.wheel]
packages = ["lineage"]
