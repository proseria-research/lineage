name: images

# Builds the two container images and publishes them to GHCR.
#
#   ghcr.io/<owner>/lineage       the registry itself (Dockerfile)
#   ghcr.io/<owner>/lineage-init  the KServe storage-initializer (Dockerfile.init)
#
# Pull requests build both images but never push, so a change to a Dockerfile is verified
# before it can reach the registry.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.init'
      - 'cmd/**'
      - 'internal/**'
      - 'tests/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to the same ref supersedes this run. Tag builds are never cancelled — a
# half-published release is worse than a slow one.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Nothing is published that has not passed the suite. The default build tag compiles a stub
  # console, so this needs no Node; the tests bring up their own Postgres and Redis in-process.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags=e2e ./tests/e2e -count=1 -timeout=5m -v

  # The hermetic job above proves SQLite + filesystem. This job exercises the same real
  # binary through the production adapter wiring: Postgres metadata and direct-to-S3 uploads.
  e2e-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lineage
          POSTGRES_PASSWORD: lineage
          POSTGRES_DB: lineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lineage -d lineage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start MinIO and create the test bucket
        run: |
          docker run -d --name lineage-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/lineage-e2e'
      - name: Run Postgres and S3 process E2E
        env:
          LINEAGE_E2E_POSTGRES_DSN: postgres://lineage:lineage@127.0.0.1:5432/lineage?sslmode=disable
          LINEAGE_E2E_S3_ENDPOINT: http://127.0.0.1:9000
          LINEAGE_E2E_S3_BUCKET: lineage-e2e
          LINEAGE_E2E_S3_REGION: us-east-1
          LINEAGE_E2E_S3_KEY: minioadmin
          LINEAGE_E2E_S3_SECRET: minioadmin
          LINEAGE_E2E_S3_PATH_STYLE: "true"
        run: go test -tags=e2e ./tests/e2e -run '^TestPostgresS3ProcessWorkflow$' -count=1 -timeout=5m -v

  build:
    needs: [test, e2e-backends]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lineage
            dockerfile: Dockerfile
          - name: lineage-init
            dockerfile: Dockerfile.init
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase path, and an owner login may legitimately contain one.
      - name: Resolve image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # No QEMU: both Dockerfiles pin their build stages to $BUILDPLATFORM and cross-compile
      # via GOARCH, and the runtime stages only COPY. Nothing foreign-arch is ever executed.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Supply-chain attestations, attached to the image in the registry.
          #
          #   provenance  SLSA record of what built this — repo, commit, workflow, base
          #               images, build args. mode=max keeps the full material list.
          #   sbom        Package inventory. The generator reads the Go module table out of
          #               the binary, so a scanner sees the real go.mod dependency set even
          #               though the runtime layer is distroless and has no package manager.
          #
          # These add manifests carrying the platform unknown/unknown to the image index.
          # containerd, GHCR and KServe ignore them correctly; a tool that enumerates
          # platforms naively will list them. Verify with:
          #
          #   docker buildx imagetools inspect ghcr.io/<owner>/lineage:latest \
          #     --format '{{ json .Provenance }}'
          provenance: mode=max
          sbom: true
